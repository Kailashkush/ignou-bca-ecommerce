<text x="470" y="221" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" >E-Commerce</text>
<text x="470" y="235" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" >System</text>
<line x1="198" y1="186" x2="366" y2="186" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowb)"/>
<text x="282" y="170" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >registration, sign-in, search,</text>
