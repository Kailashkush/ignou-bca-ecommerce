<line x1="1160" y1="364" x2="1160" y2="416" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1176" y="400" font-size="12" fill="#b45309" font-weight="700" text-anchor="middle" >M</text>
<text x="670" y="200" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" >Cardinality notation</text>
<text x="670" y="219" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" >1 : M  read as “one … many”.</text>
<text x="670" y="238" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" ></text>
<text x="670" y="257" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" >ORDER_ITEM is an embedded sub-document array inside ORDER,</text>
<text x="670" y="276" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" >not a separate collection. It is drawn as a weak entity because it</text>
<text x="670" y="295" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" >has no independent existence: its identity is (orderId, productId).</text>
<text x="670" y="314" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" ></text>
<text x="670" y="333" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" >The line snapshots title and unitPrice at the moment of sale so a</text>
<text x="670" y="352" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" >later price change cannot rewrite a historical invoice.</text>
<text x="670.0" y="876" font-size="12" fill="#64748b" font-weight="500" text-anchor="middle" >Four collections and one embedded sub-document array. Relationships are carried by ObjectId reference fields rather than by foreign-key constraints.</text>
</svg>
