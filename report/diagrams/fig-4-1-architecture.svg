<text x="1020.0" y="357" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" >orders</text>
<text x="1020.0" y="374" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle" >unique invoiceNo; (user, placedAt)</text>
<rect x="872" y="410" width="296" height="46" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="1020.0" y="429" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" >Schema validation</text>
<text x="1020.0" y="446" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle" >Mongoose, at write time</text>
<rect x="872" y="482" width="296" height="46" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="1020.0" y="501" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" >Atomic $inc on stockCount</text>
<text x="1020.0" y="518" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle" >single-document guarantee</text>
<line x1="392" y1="300" x2="448" y2="300" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="420" y="274" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >HTTPS</text>
<text x="420" y="288" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >JSON</text>
<line x1="448" y1="360" x2="392" y2="360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="792" y1="300" x2="848" y2="300" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="820" y="274" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >Mongo</text>
<text x="820" y="288" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >wire</text>
<line x1="848" y1="360" x2="792" y2="360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="620.0" y="606" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" >The browser never reaches the database. Every request passes through the Express middleware chain, so authentication,</text>
<text x="620.0" y="624" font-size="12" fill="#64748b" font-weight="400" text-anchor="middle" >authorisation, input sanitisation and rate limiting are applied uniformly and cannot be bypassed by a crafted client.</text>
<text x="620.0" y="672" font-size="12" fill="#64748b" font-weight="500" text-anchor="middle" >Figure 4.1 — the decoupled three-tier arrangement adopted for the project.</text>
