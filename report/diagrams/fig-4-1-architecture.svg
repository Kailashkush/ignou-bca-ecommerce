<text x="1020.0" y="285" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" >products</text>
<text x="1020.0" y="302" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle" >weighted text index; (category, price)</text>
