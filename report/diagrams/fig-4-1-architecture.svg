<text x="620.0" y="429" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" >Services</text>
<text x="620.0" y="446" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle" >catalog · checkout · payment</text>
<rect x="472" y="482" width="296" height="46" rx="7" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<text x="620.0" y="501" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" >Central error handler</text>
<text x="620.0" y="518" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle" >one response shape</text>
