<text x="1020.0" y="213" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle" >categories</text>
<text x="1020.0" y="230" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle" >unique index on name, slug</text>
