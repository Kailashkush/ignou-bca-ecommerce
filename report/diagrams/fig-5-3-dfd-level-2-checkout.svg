<text x="710.0" y="588" font-size="12" fill="#64748b" font-weight="500" text-anchor="middle" >Stock is reserved (4.3) before the payment is authorised (4.4), so nobody is charged for an item that has just sold out; 4.6 returns the reservation when authorisation fails.</text>
