<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 570" width="1260" height="570" font-family="Inter, Helvetica, Arial, sans-serif">
<rect width="1260" height="570" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/></marker>
</defs>
<text x="630.0" y="36" font-size="16" fill="#0f172a" font-weight="700" text-anchor="middle" >Figure 6.1   Order Status State Machine</text>
<circle cx="86" cy="190" r="13" fill="#0f172a"/>
<text x="86" y="230" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >order placed</text>
<rect x="146.0" y="159.0" width="168" height="62" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<text x="230" y="186" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle" >PENDING</text>
<text x="230" y="205" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle" >cash on delivery</text>
<rect x="386.0" y="159.0" width="168" height="62" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<text x="470" y="186" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle" >CONFIRMED</text>
<text x="470" y="205" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle" >payment authorised</text>
<rect x="626.0" y="159.0" width="168" height="62" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<text x="710" y="186" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle" >SHIPPED</text>
<text x="710" y="205" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle" >handed to courier</text>
<rect x="866.0" y="159.0" width="168" height="62" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="950" y="186" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle" >DELIVERED</text>
<text x="950" y="205" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle" >terminal</text>
<rect x="485.0" y="369.0" width="210" height="62" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="590" y="396" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle" >CANCELLED</text>
<text x="590" y="415" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle" >stock returned to catalogue</text>
<line x1="101" y1="190" x2="142" y2="190" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="120" y="176" font-size="10" fill="#64748b" font-weight="400" text-anchor="start" >cash on delivery</text>
<polyline points="86,177 86,112 470,112 470,155" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="278" y="104" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >card payment authorised at checkout</text>
<line x1="316" y1="190" x2="384" y2="190" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowb)"/>
<rect x="305.8" y="167" width="88.39999999999999" height="16" rx="3" fill="#ffffff" opacity="0.94"/>
<text x="350.0" y="179" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >admin confirms</text>
<line x1="556" y1="190" x2="624" y2="190" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowb)"/>
<rect x="554.2" y="167" width="71.6" height="16" rx="3" fill="#ffffff" opacity="0.94"/>
<text x="590.0" y="179" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >admin ships</text>
<line x1="796" y1="190" x2="864" y2="190" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowb)"/>
<rect x="785.8" y="167" width="88.39999999999999" height="16" rx="3" fill="#ffffff" opacity="0.94"/>
<text x="830.0" y="179" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >admin delivers</text>
<circle cx="1084" cy="190" r="14" fill="none" stroke="#0f172a" stroke-width="2"/>
<circle cx="1084" cy="190" r="8" fill="#0f172a"/>
<line x1="1035" y1="190" x2="1068" y2="190" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="230,221 230,400 484,400" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="262" y="380" font-size="11" fill="#64748b" font-weight="400" text-anchor="start" >customer or admin cancels</text>
<polyline points="470,221 470,340 560,340 560,368" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="590" cy="482" r="14" fill="none" stroke="#0f172a" stroke-width="2"/>
<circle cx="590" cy="482" r="8" fill="#0f172a"/>
<line x1="590" y1="432" x2="590" y2="464" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="980" y="330" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >Once an order is SHIPPED it can no longer</text>
<text x="980" y="347" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >be cancelled: the parcel has left the store.</text>
<text x="980" y="364" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" ></text>
<text x="980" y="381" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >DELIVERED and CANCELLED are terminal.</text>
<text x="980" y="398" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >The transition table is declared on the Order</text>
<text x="980" y="415" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle" >model, so every code path is bound by it.</text>
<text x="630.0" y="548" font-size="12" fill="#64748b" font-weight="500" text-anchor="middle" >Five states with seven legal transitions. A cash-on-delivery order is additionally marked paid when it reaches DELIVERED.</text>
</svg>
